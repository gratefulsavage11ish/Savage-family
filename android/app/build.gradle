plugins {
    id 'com.android.application'
}

android {
    namespace 'com.savageai.family'
    compileSdk 35

    defaultConfig {
        applicationId 'com.savageai.family'
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName '0.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
