name: Build Savage Android APK

on:
  push:
    branches:
      - android-apk-v1
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "Android SDK root: $SDKROOT"
          SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDKROOT"
            find "$SDKROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Savage APK
        uses: actions/upload-artifact@v4
        with:
          name: Savage-AI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
