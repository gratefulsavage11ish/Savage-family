name: Savage Family CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve executable scripts
        run: chmod +x scripts/bootstrap-termux.sh scripts/doctor-termux.sh
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          savage version
          python -m savage version
      - name: Package source artifact
        run: |
          mkdir -p dist/savage-family
          cp -R savage scripts docs tests pyproject.toml README.md dist/savage-family/
          tar -czf dist/savage-family-source.tar.gz -C dist savage-family
      - uses: actions/upload-artifact@v4
        with:
          name: savage-family-source
          path: dist/savage-family-source.tar.gz
          if-no-files-found: error
